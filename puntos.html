<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Puntos - RED vs PINK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --verde:#33ff33; --rojo:#ff4d6d; }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:var(--verde); font-family:Consolas,"Courier New",monospace; padding:14px 18px 40px; }
  h1 { margin:0 0 4px; font-size:18px; }
  .sub { opacity:.8; font-size:13px; margin-bottom:12px; line-height:1.5; max-width:900px; }
  .fila { border:1px solid #14601a; background:rgba(0,14,0,.9); padding:9px 14px; margin-bottom:8px; max-width:900px;
          display:grid; grid-template-columns:1fr 230px 86px; gap:6px 14px; align-items:center; }
  .fila b { font-size:14px; }
  .ayuda { grid-column:1; font-size:12px; opacity:.75; line-height:1.4; }
  input[type=range] { width:100%; accent-color:var(--verde); }
  input[type=number] { width:86px; background:#031a03; color:var(--verde); border:1px solid var(--verde); font-family:inherit; padding:4px; text-align:right; }
  .pos b { color:var(--verde); } .neg b { color:var(--rojo); } .neg input[type=range] { accent-color:var(--rojo); }
  #aviso { position:sticky; top:0; background:#000; padding:6px 0; font-size:14px; min-height:30px; }
  button { background:#031a03; color:var(--verde); border:1px solid var(--verde); padding:6px 12px; font-family:inherit; font-size:14px; cursor:pointer; }
  button:hover { background:#0a3a0a; }
  @media (max-width:760px) { .fila { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>&gt; ¿QUÉ DA Y QUÉ QUITA PUNTOS?</h1>
<div class="sub">Mueve un deslizador y se guarda solo. <b>Se aplica desde la siguiente partida de entrenamiento</b>, sin parar nada.
  Ojo: las IAs no cambian de golpe, tardan unos minutos de partidas en adaptarse a las reglas nuevas. En <span style="color:var(--rojo)">rojo</span> están
  los castigos (restan puntos).</div>
<div id="aviso"></div>
<div id="lista"></div>
<p><button id="b-defecto">↺ Volver a los valores de por defecto</button></p>

<script>
const $ = id => document.getElementById(id);
const CAB = { "Content-Type": "application/json", "X-RVP": "1" };
let valores = {}, meta = [], temporizador = null;

function aviso(t, mal) { $("aviso").textContent = t; $("aviso").style.color = mal ? "#ff4d6d" : "#33ff33"; }

function guardar() {
  clearTimeout(temporizador);
  temporizador = setTimeout(async () => {
    try {
      const r = await fetch("/api/recompensas", { method: "POST", headers: CAB, body: JSON.stringify({ valores }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      aviso("✔ guardado · se aplica en la siguiente partida");
    } catch (e) { aviso("⚠ no se pudo guardar: " + e.message, true); }
  }, 350);
}

function fila(p) {
  const neg = p.defecto < 0 || p.max <= 0;
  const d = document.createElement("div"); d.className = "fila " + (neg ? "neg" : "pos");
  const dec = p.paso >= 1 ? 0 : p.paso < 0.01 ? 4 : p.paso < 0.1 ? 3 : 2;
  d.innerHTML = `<b>${p.titulo}</b><input type="range" min="${p.min}" max="${p.max}" step="${p.paso}"><input type="number" min="${p.min}" max="${p.max}" step="${p.paso}">` +
                `<div class="ayuda">${p.ayuda} <i>(por defecto ${p.defecto})</i></div>`;
  const [rango, numero] = d.querySelectorAll("input");
  const poner = v => { rango.value = v; numero.value = (+v).toFixed(dec); };
  poner(valores[p.clave]);
  rango.oninput = () => { valores[p.clave] = +rango.value; poner(rango.value); guardar(); };
  numero.onchange = () => { const v = Math.max(p.min, Math.min(p.max, +numero.value || 0)); valores[p.clave] = v; poner(v); guardar(); };
  return d;
}

async function cargar() {
  const d = await (await fetch("/api/recompensas")).json();
  valores = d.valores; meta = d.meta;
  pintar();
}
// Los de grupo "entrenamiento" no son puntos: van aparte, con su título
function pintar() {
  const trozos = [];
  meta.forEach((p, i) => {
    if (p.grupo === "entrenamiento" && (i === 0 || meta[i - 1].grupo !== "entrenamiento")) {
      const h = document.createElement("h1"); h.style.marginTop = "22px"; h.textContent = "> AJUSTES DEL ENTRENAMIENTO";
      trozos.push(h);
    }
    trozos.push(fila(p));
  });
  $("lista").replaceChildren(...trozos);
}
$("b-defecto").onclick = () => {
  if (!confirm("¿Volver a todos los valores de por defecto?")) return;
  meta.forEach(p => valores[p.clave] = p.defecto);
  pintar(); guardar();
};
cargar().catch(() => aviso("⚠ No me conecto con el servidor.", true));
</script>
</body>
</html>
